[project]
name = "demo-stacks"
version = "0.1.0"
description = "Shared TPC-H dataset and semantic view definitions for the s-layer demo stacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # semantic_views is built per DuckDB release; 1.5.6 is the newest release on PyPI
    # with a community build, and the one semolina's duckdb extra pins.
    "duckdb==1.5.6",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Stack 2 (Lakehouse//RT): the Statement Execution path, which RT requires.
databricks = ["adbc-poolhouse[databricks-python]>=1.6.4"]

[project.scripts]
demo-stacks = "demo_stacks.cli:main"

[dependency-groups]
dev = [
    "adbc-poolhouse[databricks-python]>=1.6.4",
    "basedpyright>=1.38",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15",
    "semolina[duckdb]>=0.7.0",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_stacks"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
# A suppression that no longer suppresses anything hides nothing but its own staleness.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D", "TID", "BLE", "RUF"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring
    "D203",  # conflicts with D211
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood is awkward for properties
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
testpaths = ["tests"]
