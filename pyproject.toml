[project]
name = "demo-stacks"
version = "0.1.0"
description = "Shared TPC-H dataset and semantic view definitions for the s-layer demo stacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # semantic_views is built per DuckDB release; 1.5.6 is the newest release on PyPI
    # with a community build, and the one semolina's duckdb extra pins.
    "duckdb==1.5.6",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
demo-stacks = "demo_stacks.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "semolina[duckdb]>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_stacks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
